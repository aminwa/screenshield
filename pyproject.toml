[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshield"
version = "0.1.0"
description = "local screen guardian — real-time secret detection via OCR"
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "rich>=13.0",
    "typer>=0.12",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "toml>=0.10",
    "psutil>=5.9",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
screenshield = "screenshield.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
